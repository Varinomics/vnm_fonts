family_override_note = "Upstream files this face under the typographic family 'Font Awesome 7 Free', the same name the Regular face above declares. Two files claiming one family entry is the condition this repository exists to avoid, occurring here inside a single upstream release: without a correction the two register as one family and the host is free to resolve either. The override below gives the Solid face its own typographic family before the runtime suffix is appended. vnm_framework already applies exactly this correction to the same file, rewriting name ID 16 to 'Font Awesome 7 Free Solid' in THIRD_PARTY/recipes/prepare_varinomics_embedded_font.py; this carries that shipped correction into the patcher rather than originating one."

[artifact.family_override]
16 = "Font Awesome 7 Free Solid"
