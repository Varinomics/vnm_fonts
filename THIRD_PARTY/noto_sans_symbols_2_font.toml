build_revision_role = "immutable provenance input; the design and version the CDN build was compiled from, not the byte stream itself"
build_path = "ofl/notosanssymbols2/NotoSansSymbols2-Regular.ttf"
build_sha256 = "7d5fb73b7ca67a6798101741f5d280a3d016a56a197afcd4199dbb57b4b82a21"
build_size = 1233128
build_relationship = "The CDN stream is a fontTools recompile of this file: same name table, head timestamps, fontRevision and 2976 glyphs; glyf, loca, GPOS, GSUB, cmap, head and name are re-packed while OS/2, hmtx, post, cvt, fpgm, prep, gasp, hhea, vhea and vmtx are bit-identical. The repository file is itself byte-identical to NotoSansSymbols2/googlefonts/ttf/NotoSansSymbols2-Regular.ttf in the notofonts/symbols release NotoSansSymbols2-v2.008."
build_alternatives_ruled_out = "google/fonts at v2.007 (4eebd9267361d76e55249dbbd2017adb9a3c7b450b73a78c0556b47fb2df047e), v2.006 (efa10dce4b1848679795bacbcabbd1bf4af16d70b40288e399ffc5d43aad0c1c) and v2.005 (690f85a54d026a549d5d54f8c9e0da534db4cbc98a3e8f4db06a47e4ddf440d9); the full, hinted and unhinted builds in the symbols v2.008 release; and every notofonts.github.io blob under fonts/NotoSansSymbols2. None matches."

