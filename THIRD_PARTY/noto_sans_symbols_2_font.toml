source_cdn_discovery = "The URL is listed under manifest.fileRefs in the JSON at https://fonts.google.com/download/list?family=Noto%20Sans%20Symbols%202, whose body is prefixed by a five-byte XSSI guard."
source_verification = "Downloaded from the CDN URL above and confirmed byte-identical to vnm_framework/rc/NotoSansSymbols2-Regular.ttf, the file this repository inherited."

build_repository = "https://github.com/google/fonts"
