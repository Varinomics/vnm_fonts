source_provenance_class = "cdn_build"
source_provenance_note = "This is the one face whose bytes are not a git-addressable object. They are a Google Fonts CDN build: content-addressed, immutable while the family stays at v25, and gone when Google republishes. vnm_framework recorded no source URL for this file, so the file it vendored was taken as the input and the chain below is what could be established about it."
