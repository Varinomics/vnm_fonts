source_provenance_note = "The shipped bytes are the locally built static Regular output from derivative builder 0.1.5 identified by its SHA-256 above. Original procedural outlines add U+2722, U+2733, U+2736, U+273B and U+273D with a 560-unit character advance and cell-contained ink. Existing glyph outlines, character advances and line metrics match the preceding shipped 0.1.4 output. U+21E7 retains its hollow Shift arrow. All Braille patterns U+2800-U+28FF retain a 280-unit horizontal dot pitch across adjacent character cells and a 300-unit vertical pitch across nominal 1200-unit lines. The source inputs and Ubuntu Font Licence are unchanged. No release artifact has been published for this local build."

